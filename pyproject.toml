[project]
name = "emma-cellpose-analysis"
version = "0.2.0"
description = "End-to-end multi-well plate colony segmentation using wellcrop and Cellpose"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # AI Models & Dependencies
    # cellpose pulls in the SAM backbone (segment-anything) for the cpsam_v2 model.
    "cellpose>=4.2.1.1",
    "torch>=2.1.2",
    # Image Processing & Math
    "opencv-python>=4.9.0",
    "tifffile>=2024.1.30",
    "numpy>=1.26.0",
    "scipy",
    "matplotlib",
    # Data Export & Notebooks
    "pandas>=2.2.0",
    "tqdm",
    "jupyter>=1.0.0",
    # Under-the-hood fixes
    "packaging",
    "jupyter-bbox-widget>=0.7.0",
    "wellcrop>=0.2.0",
]

[tool.uv]
managed = true
dev-dependencies = [
    "jupyter>=1.1.1",
]
